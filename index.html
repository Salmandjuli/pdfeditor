<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF & Photo Suite Pro</title>

  <!-- Load External Libraries via Reliable CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #f43f5e;
      --accent-hover: #e11d48;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding: 20px; }
    
    header { text-align: center; margin-bottom: 30px; }
    header h1 { color: var(--accent-color); font-size: 2.2rem; margin-bottom: 8px; }
    header p { color: var(--text-muted); }

    .container { max-width: 1000px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
    
    .nav-tabs { display: flex; gap: 8px; overflow-x: auto; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; margin-bottom: 20px; }
    .tab-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; border-radius: 6px; cursor: pointer; white-space: nowrap; font-weight: 600; }
    .tab-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .drop-zone { border: 2px dashed var(--border-color); padding: 30px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 15px; background: rgba(255,255,255,0.02); }
    .drop-zone:hover { border-color: var(--accent-color); background: rgba(244,63,94,0.05); }

    .control-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.9rem; color: var(--text-muted); margin-bottom: 5px; }
    input, select, button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border-color); background: #0f172a; color: white; }
    
    .btn-action { background: var(--accent-color); border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-action:hover { background: var(--accent-hover); }

    .status-box { margin-top: 15px; padding: 10px; text-align: center; border-radius: 6px; font-weight: bold; }
    
    /* Photo Editor Specifics */
    .editor-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .editor-layout { grid-template-columns: 1fr; } }
    .canvas-container { text-align: center; background: #0f172a; padding: 10px; border-radius: 8px; overflow: hidden; }
    canvas { max-width: 100%; max-height: 400px; border-radius: 4px; }
  </style>
</head>
<body>

  <header>
    <h1>PDF & Photo Suite</h1>
    <p>Semua pemrosesan dilakukan di browser Anda (Aman & Privat)</p>
  </header>

  <div class="container">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="setTab('compress')">📉 Kompres PDF</button>
      <button class="tab-btn" onclick="setTab('merge')">🧩 Gabung PDF</button>
      <button class="tab-btn" onclick="setTab('split')">✂️ Pisah PDF</button>
      <button class="tab-btn" onclick="setTab('photo')">🖼️ Edit Foto</button>
    </div>

    <!-- COMPRESS PDF -->
    <div id="tab-compress" class="tab-content active">
      <div class="drop-zone" onclick="document.getElementById('compressFile').click()">
        📄 Pilih File PDF
        <input type="file" id="compressFile" accept="application/pdf" style="display:none;" onchange="showName(this, 'compressInfo')">
      </div>
      <p id="compressInfo" style="margin-bottom: 10px; font-size: 0.9rem; color: var(--accent-color);"></p>
      
      <div class="control-group">
        <label>Kualitas Kompresi:</label>
        <select id="compressQuality">
          <option value="0.4">Tinggi (Ukuran Lebih Kecil)</option>
          <option value="0.6" selected>Sedang (Rekomendasi)</option>
          <option value="0.8">Rendah (Kualitas Lebih Bagus)</option>
        </select>
      </div>
      <button class="btn-action" onclick="processCompress()">Kompres & Unduh</button>
      <div id="compressStatus" class="status-box"></div>
    </div>

    <!-- MERGE PDF -->
    <div id="tab-merge" class="tab-content">
      <div class="drop-zone" onclick="document.getElementById('mergeFiles').click()">
        📄 Pilih Beberapa PDF (Minimal 2)
        <input type="file" id="mergeFiles" accept="application/pdf" multiple style="display:none;" onchange="showName(this, 'mergeInfo')">
      </div>
      <p id="mergeInfo" style="margin-bottom: 10px; font-size: 0.9rem; color: var(--accent-color);"></p>
      <button class="btn-action" onclick="processMerge()">Gabungkan PDF</button>
      <div id="mergeStatus" class="status-box"></div>
    </div>

    <!-- SPLIT PDF -->
    <div id="tab-split" class="tab-content">
      <div class="drop-zone" onclick="document.getElementById('splitFile').click()">
        📄 Pilih File PDF
        <input type="file" id="splitFile" accept="application/pdf" style="display:none;" onchange="showName(this, 'splitInfo')">
      </div>
      <p id="splitInfo" style="margin-bottom: 10px; font-size: 0.9rem; color: var(--accent-color);"></p>
      <div class="control-group">
        <label>Rentang Halaman (Contoh: 1-3 atau 2):</label>
        <input type="text" id="splitRange" placeholder="e.g. 1-3">
      </div>
      <button class="btn-action" onclick="processSplit()">Pisahkan PDF</button>
      <div id="splitStatus" class="status-box"></div>
    </div>

    <!-- PHOTO EDITOR -->
    <div id="tab-photo" class="tab-content">
      <div class="drop-zone" onclick="document.getElementById('photoFile').click()">
        📷 Pilih Gambar / Foto (JPG, PNG)
        <input type="file" id="photoFile" accept="image/*" style="display:none;" onchange="loadPhoto(event)">
      </div>
      
      <div class="editor-layout">
        <div class="canvas-container">
          <canvas id="photoCanvas"></canvas>
        </div>
        <div>
          <div class="control-group">
            <label>Kecerahan (Brightness):</label>
            <input type="range" id="bright" min="50" max="150" value="100" oninput="applyFilters()">
          </div>
          <div class="control-group">
            <label>Kontras (Contrast):</label>
            <input type="range" id="contrast" min="50" max="150" value="100" oninput="applyFilters()">
          </div>
          <div class="control-group">
            <label>Efek Filter:</label>
            <select id="filterSelect" onchange="applyFilters()">
              <option value="none">Normal</option>
              <option value="grayscale(100%)">Hitam Putih</option>
              <option value="sepia(100%)">Sepia</option>
              <option value="invert(100%)">Invert Warna</option>
            </select>
          </div>
          <button class="btn-action" onclick="downloadPhoto()">Unduh Foto Hasil Edit</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Set PDF.js Worker secara aman
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    }

    function setTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      event.target.classList.add('active');
    }

    function showName(input, targetId) {
      if(input.files.length > 0) {
        const names = Array.from(input.files).map(f => f.name).join(', ');
        document.getElementById(targetId).innerText = 'Terpilih: ' + names;
      }
    }

    /* COMPRESS */
    async function processCompress() {
      const file = document.getElementById('compressFile').files[0];
      const status = document.getElementById('compressStatus');
      const q = parseFloat(document.getElementById('compressQuality').value);
      if(!file) return alert('Pilih file PDF dahulu!');

      status.innerText = 'Mengompres PDF...';
      try {
        const bytes = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({data: bytes}).promise;
        const { jsPDF } = window.jspdf;
        let outPdf = null;

        for(let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const vp = page.getViewport({scale: 1.2});
          const cvs = document.createElement('canvas');
          cvs.width = vp.width; cvs.height = vp.height;
          await page.render({canvasContext: cvs.getContext('2d'), viewport: vp}).promise;

          const img = cvs.toDataURL('image/jpeg', q);
          if(i === 1) outPdf = new jsPDF({unit:'px', format:[vp.width, vp.height]});
          else outPdf.addPage([vp.width, vp.height]);
          outPdf.addImage(img, 'JPEG', 0, 0, vp.width, vp.height);
        }

        outPdf.save(`compressed_${file.name}`);
        status.innerText = '✅ Kompresi Selesai!';
      } catch(e) {
        console.error(e);
        status.innerText = '❌ Gagal mengompres. Pastikan koneksi internet stabil untuk pemuatan pustaka.';
      }
    }

    /* MERGE */
    async function processMerge() {
      const files = document.getElementById('mergeFiles').files;
      const status = document.getElementById('mergeStatus');
      if(files.length < 2) return alert('Pilih minimal 2 file!');

      status.innerText = 'Menggabungkan PDF...';
      try {
        const merged = await PDFLib.PDFDocument.create();
        for(let f of files) {
          const doc = await PDFLib.PDFDocument.load(await f.arrayBuffer());
          const pages = await merged.copyPages(doc, doc.getPageIndices());
          pages.forEach(p => merged.addPage(p));
        }
        const bytes = await merged.save();
        const blob = new Blob([bytes], {type: 'application/pdf'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'merged.pdf';
        a.click();
        status.innerText = '✅ Penggabungan Berhasil!';
      } catch(e) {
        status.innerText = '❌ Gagal menggabungkan PDF.';
      }
    }

    /* SPLIT */
    async function processSplit() {
      const file = document.getElementById('splitFile').files[0];
      const range = document.getElementById('splitRange').value;
      const status = document.getElementById('splitStatus');
      if(!file || !range) return alert('Pilih file dan isi rentang halaman!');

      status.innerText = 'Memisahkan PDF...';
      try {
        const doc = await PDFLib.PDFDocument.load(await file.arrayBuffer());
        const newDoc = await PDFLib.PDFDocument.create();
        const parts = range.split('-').map(n => parseInt(n.trim()) - 1);
        
        let indices = [];
        if(parts.length === 2) {
          for(let i = parts[0]; i <= parts[1]; i++) indices.push(i);
        } else indices.push(parts[0]);

        const pages = await newDoc.copyPages(doc, indices);
        pages.forEach(p => newDoc.addPage(p));

        const bytes = await newDoc.save();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
        a.download = `split_${file.name}`;
        a.click();
        status.innerText = '✅ Pemisahan Berhasil!';
      } catch(e) {
        status.innerText = '❌ Gagal memisahkan PDF. Cek rentang halaman.';
      }
    }

    /* PHOTO EDITOR */
    let imgObj = new Image();
    function loadPhoto(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        imgObj.onload = () => applyFilters();
        imgObj.src = event.target.result;
      }
      if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
    }

    function applyFilters() {
      const cvs = document.getElementById('photoCanvas');
      const ctx = cvs.getContext('2d');
      if(!imgObj.src) return;

      cvs.width = imgObj.width;
      cvs.height = imgObj.height;

      const b = document.getElementById('bright').value;
      const c = document.getElementById('contrast').value;
      const f = document.getElementById('filterSelect').value;

      ctx.filter = `brightness(${b}%) contrast(${c}%) ${f !== 'none' ? f : ''}`;
      ctx.drawImage(imgObj, 0, 0);
    }

    function downloadPhoto() {
      const cvs = document.getElementById('photoCanvas');
      if(!imgObj.src) return alert('Unggah foto terlebih dahulu!');
      const a = document.createElement('a');
      a.href = cvs.toDataURL('image/png');
      a.download = 'edited_photo.png';
      a.click();
    }
  </script>
</body>
</html>
